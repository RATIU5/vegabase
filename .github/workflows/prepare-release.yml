name: prepare-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release label, none for a stable release
        type: choice
        options: [none, alpha, beta, rc]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  MISE_LOCKED: "1"

jobs:
  prepare:
    permissions:
      contents: write
      pull-requests: write
    if: "github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
      - id: pending
        run: if find .changeset -name '*.md' 2> /dev/null | grep -q .; then echo found=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.found == 'true'
        run: mise run release:prepare -- ${PRERELEASE:+--prerelease-label "$PRERELEASE"}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease == 'none' && '' || inputs.prerelease }}
