<div class="rules">
<p class="lead">Read this before the example files. The examples show the syntax; these are the rules behind it.</p>
<h2>Files</h2><ul>
<li>A <code>.vega</code> file is HTML. Code sits inside <code>&#123;&#123; &#125;&#125;</code>, as a block or inline. <span class=ref>D-16, D-17</span></li>
<li>Definitions go in the first block only. <span class=ref>D-17</span></li>
<li>Folders and file names carry no meaning. Pages exist only in the admin, never in code. <span class=ref>D-13</span></li>
<li>A name the theme defines is written bare and is visible from every file. A prefix, as in <code>std.Image</code>, always names a library, and <code>use</code> names that library. <span class=ref>D-18, D-24</span></li>
<li><code>#</code> starts a comment. It runs to the end of the line or to <code>&#125;&#125;</code>. <span class=ref>D-39</span></li>
</ul>
<h2>Brackets</h2><ul>
<li>A lowercase name with <code>( )</code> is a function call and takes values by position: <code>std.take(8)</code>. <span class=ref>D-43, D-47</span></li>
<li>A capitalised name with <code>{ }</code> is a type being filled in and takes <code>name = value</code>: <code>Text { max = 80 }</code>, <code>BuyButton {}</code>. <span class=ref>D-44, D-47</span></li>
<li>The words <code>component</code>, <code>fields</code>, <code>props</code> and <code>locale</code> also take a <code>{ }</code> block. <code>fields</code> and <code>props</code> hold <code>name: Type</code> lines, not <code>name = value</code>. <span class=ref>D-36, D-59</span></li>
<li>A <code>{ }</code> with no name groups keys in a <code>locale</code> table, and <code>@{ }</code> holds admin settings. Both take <code>name = value</code>. <span class=ref>D-46, D-47</span></li>
<li><code>[ ]</code> holds a list of values. Entries on one line need a comma; entries on separate lines do not. <span class=ref>D-45</span></li>
<li>Types start with a capital letter. Every other name starts lowercase. <span class=ref>D-47</span></li>
</ul>
<h2>Types</h2><ul>
<li>Limits go in braces after the type: <code>Int { min = 0, max = 90 }</code>, <code>slot Blocks { max = 12 }</code>, <code>List { of = Text, max = 4 }</code>. <span class=ref>D-44, D-48, D-50</span></li>
<li><code>Type?</code> can be null. The template must handle it with <code>if x != null</code> or <code>??</code>, or the file fails the check. There is no truthiness. <span class=ref>D-15, E-5a</span></li>
<li><code>A | B</code> in a type is a union. A slot accepts the components its union names. <span class=ref>D-26, D-29</span></li>
<li>A loader that finds nothing: with <code>Type</code>, the host answers 404 and renders the site's not-found page. With <code>Type?</code>, the value is null. <span class=ref>D-38</span></li>
</ul>
<h2>Components</h2><ul>
<li><code>Name :: component { }</code> defines a component. Inside it, <code>fields { }</code> holds what an editor fills in, and <code>props { }</code> holds what code passes or loads. Both are optional. <span class=ref>D-59</span></li>
<li><code>template Hero</code> says that the HTML in this file is the template of <code>Hero</code>. Every file with HTML needs the line, and the component may be defined in the same file or in another. A file with no HTML, such as <code>shared.vega</code>, has none. <code>SiteMeta</code> shows the split form: defined in <code>shared.vega</code>, template in <code>SiteMeta.vega</code>. <span class=ref>D-16, D-61</span></li>
<li>The template reads both by bare name: <code>&#123;&#123;heading&#125;&#125;</code>, <code>&#123;&#123;product.title&#125;&#125;</code>. A field and a prop with the same name is an error. <span class=ref>D-59</span></li>
<li>The admin offers a component only if a union used by a slot lists it. A component in no union, such as <code>ProductCard</code>, is code-only. <span class=ref>D-59</span></li>
<li>The shell is the exception. No union lists <code>Shell</code>, yet the host renders it as the root of a page and stores its slots. Which component is the shell is still open. <span class=ref>D-31, Q-40</span></li>
<li><code>&#123;&#123;render ProductCard { product = item } &#125;&#125;</code> renders a component from code and sets its values in braces. <span class=ref>D-49</span></li>
</ul>
<h2>Content types</h2><ul>
<li><code>Name :: content { }</code> defines a content type: the shape of a thing an editor creates many of and does not place on a page, such as a recipe or a blog post. <span class=ref>D-63</span></li>
<li>It is written like a component: its own <code>@{ }</code> block, then <code>fields { }</code>. It has no <code>props</code> and no template. <span class=ref>D-63</span></li>
<li>Its name is a type. A component takes one as a prop: <code>recipe: Recipe</code>, then <code>&#123;&#123;recipe.title&#125;&#125;</code>. <span class=ref>D-63</span></li>
<li>In <code>fields</code>, the same line is a picker: the editor chooses one recipe. <span class=ref>D-55, D-63</span></li>
</ul>
<h2>Plugins</h2><ul>
<li>A plugin may ship <code>.vega</code> files with components, unions, aliases, content types and locales. <span class=ref>D-64</span></li>
<li>In a theme, a plugin's names keep their prefix, and the file names the plugin with <code>use</code>: <code>use maps</code>, then <code>maps.Map</code>. <span class=ref>D-18, D-64</span></li>
<li>The admin offers a plugin component only when a theme union lists it: <code>Sections :: Hero | maps.Map</code>. <span class=ref>D-64</span></li>
<li>Only a plugin can define four more things: loaders, such as <code>shopify.pageBy("size-guide")</code>; kinds of page, which supply <code>$</code> values such as <code>$shopify.product</code>; pure functions, such as <code>shopify.money</code>; and form actions. How a plugin declares them is not decided. <span class=ref>D-52, D-64</span></li>
</ul>
<h2>Slots in a template</h2><ul>
<li><code>&#123;&#123;slot blocks&#125;&#125;</code> outputs every child of the slot, in order, with no wrapper. <span class=ref>D-49</span></li>
<li>A parent may loop over the children: <code>&#123;&#123;for panel in panels&#125;&#125;</code>, then <code>&#123;&#123;slot panel&#125;&#125;</code> to output one child. <span class=ref>D-62</span></li>
<li>A slot allows only <code>for</code>, <code>std.empty</code> and <code>std.length</code>. Code cannot sort, cut or filter what an editor placed. <span class=ref>D-62</span></li>
<li>Every child is output exactly once. The template uses the short form once, or exactly one loop over the slot holds one <code>&#123;&#123;slot child&#125;&#125;</code> with no <code>if</code> between the <code>for</code> and it. Another loop over the same slot may read fields but not output. <span class=ref>D-62, D-65</span></li>
<li>A parent reads a child's fields, never its props: <code>panel.title</code>. Only a field that every component in the slot's union has, with the same type, can be read. <span class=ref>D-62</span></li>
<li>A template cannot ask which component a child is. <span class=ref>D-62</span></li>
<li><code>$id</code> is the id of this placed component, unique on the page: <code>id="&#123;&#123;$id&#125;&#125;"</code>. A template reads only its own. A parent builds the id of a wrapper from its own id and the position: <code>id="&#123;&#123;$id&#125;&#125;-&#123;&#123;i&#125;&#125;"</code>. <span class=ref>D-65</span></li>
</ul>
<h2>Fields: what an editor fills in</h2><ul>
<li>The host stores fields and the admin shows them. A slot is a field, and may have default content: <code>= [ SiteMeta {} ]</code>. <span class=ref>D-31, D-51</span></li>
<li>A field whose library type names a stored thing, such as <code>image: std.Image</code> or <code>product: shopify.Product</code>, is a picker in the admin. So is a field with a content type. <code>std.Url</code> is a plain input that is checked on save, not a picker. <span class=ref>D-41, D-55, D-63</span></li>
<li>Admin settings sit in one <code>@{ }</code> block after the type: <code>@{ label = "Subheading" }</code>. A component's own block sits at the root of <code>component { }</code>, outside <code>fields</code>. <span class=ref>D-46, D-60</span></li>
<li>Everything that starts with <code>@</code> is for the admin only. Deleting every block changes no stored data and no output. <span class=ref>D-46</span></li>
</ul>
<h2>Props: what code passes or loads</h2><ul>
<li>The admin never sees a prop. <span class=ref>D-51</span></li>
<li><code>product: shopify.Product</code>: a parent must pass it, in braces on its <code>slot</code> or <code>render</code> line. Forgetting is an error before rendering. <span class=ref>D-49, E-5c</span></li>
<li><code>product: shopify.Product = $shopify.product</code>: a parent may pass it. If none does, the page supplies it. <code>$</code> marks a page value, and a plugin declares which kind of page supplies it. <span class=ref>D-52</span></li>
<li><code>site: std.SiteSettings = std.siteSettings()</code>: the engine loads it. Equal calls run once per render. A loader may read another prop or a field. <span class=ref>D-42, D-53</span></li>
<li>A value passed to a slot flows down to every block inside it, and the nearest one wins. The checker proves that every placement an editor can make passes each prop that must be passed. Whether a page supplies a <code>$</code> value is checked by the host when the component is placed. <span class=ref>D-52, D-54</span></li>
</ul>
<h2>Output and safety</h2><ul>
<li>Every value is escaped for its position: text, attribute or URL. Only a <code>std.RichText</code> value is output as HTML, and only between tags. There is no <code>raw</code>. <span class=ref>D-37</span></li>
<li><code>std.Url</code> allows <code>http</code>, <code>https</code>, <code>mailto</code>, <code>tel</code> and relative paths. <code>std.asset</code> takes a literal path, and the file must exist. <span class=ref>D-41</span></li>
<li>A template has no functions of its own, no assignment and no IO. A loop runs only over data. A template never sets a status and never redirects. <span class=ref>brief, D-38</span></li>
<li>A pipe mixed with another operator needs parentheses: <code>(a ?? b) | std.imageUrl(1200)</code>. That is the rule, not a gap. <span class=ref>D-33</span></li>
<li><code>&#123;&#123;if&#125;&#125;</code> may sit inside a start tag to add an attribute: <code>&#123;&#123;if not product.available&#125;&#125;disabled&#123;&#123;/if&#125;&#125;</code>. It never wraps a field or a <code>use</code>. <span class=ref>D-27</span></li>
<li>A translation key is a string, <code>t("hero.label")</code>, looked up in a <code>locale</code> table. A missing key is an error before rendering. <span class=ref>D-34, D-36</span></li>
<li>A line that holds only a tag or a comment leaves nothing behind. Other whitespace is kept. There is no trim syntax. <span class=ref>D-40</span></li>
</ul>
<h2>Shown in these files, with no decision entry yet</h2><ul>
<li><code>&#123;&#123;elif ...&#125;&#125;</code> between <code>&#123;&#123;if&#125;&#125;</code> and <code>&#123;&#123;else&#125;&#125;</code>. <span class=ref>ProductCard.vega</span></li>
<li><code>&#123;&#123;for item, i in list&#125;&#125;</code> gives the position as <code>i</code>. Whether it starts at 0 or 1 is not decided. <span class=ref>ProductInfo.vega</span></li>
<li><code>Bool</code> is built in, beside <code>Text</code> and <code>Int</code>. <span class=ref>ProductMeta.vega</span></li>
</ul>
<h2>Status</h2><ul>
<li>This is a sketch. Nothing here has been parsed or run, and no grammar exists yet.</li>
<li>Still open: slots that code fills, plurals in translations, per-visitor data such as a cart, values in CSS and JSON-LD, form targets, query-string values such as a page number, local names in a template, how a plugin declares a kind of page, which component the host renders as the shell, a comment that holds <code>&#125;&#125;</code>, and how a component loads one entry of a content type or a list of them. <span class=ref>Q-52, Q-33, Q-41, Q-29, Q-31, Q-26, Q-10, D-52, Q-40, D-39, D-63</span></li>
</ul>
</div>
